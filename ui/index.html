<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=512, height=384" />
    <title>FONarch</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-theme="amber">
    <div class="app">
      <header class="titlebar" data-tauri-drag-region>
        <button type="button" id="gear" class="icon-btn" title="Settings" aria-label="Settings" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="6" y="0" width="4" height="16" fill="currentColor" />
            <rect x="0" y="6" width="16" height="4" fill="currentColor" />
            <rect x="2" y="2" width="4" height="4" fill="currentColor" />
            <rect x="10" y="2" width="4" height="4" fill="currentColor" />
            <rect x="2" y="10" width="4" height="4" fill="currentColor" />
            <rect x="10" y="10" width="4" height="4" fill="currentColor" />
            <rect x="5" y="5" width="6" height="6" fill="var(--accent)" />
            <rect x="6" y="6" width="4" height="4" fill="currentColor" />
          </svg>
        </button>
        <h1 data-tauri-drag-region>FONarch</h1>
        <div class="win">
          <button type="button" id="min" class="icon-btn" title="Minimize" aria-label="Minimize">v</button>
          <button type="button" id="close" class="icon-btn" title="Close" aria-label="Close">X</button>
        </div>
      </header>

      <div class="frame">
        <div class="stage">
          <canvas id="vis" width="248" height="240"></canvas>
          <div class="rule" aria-hidden="true"></div>
          <div class="side">
            <div id="list" class="list"></div>
            <div id="led" class="led" aria-hidden="true"></div>
          </div>
        </div>
        <p id="status" class="status">Ready...</p>
        <div class="actions">
          <button type="button" id="gather">GATHER</button>
          <button type="button" id="archive">ARCHIVE</button>
        </div>
      </div>

      <div id="menu" class="menu" hidden>
        <p class="menu-title">SETTINGS</p>
        <div class="menu-body">
        <section class="menu-section menu-theme">
          <p class="menu-label">THEME</p>
          <div class="theme-grid">
            <button type="button" class="theme-btn" data-theme="amber">AMBER<br />TERMINAL</button>
            <button type="button" class="theme-btn" data-theme="green">GREEN<br />TERMINAL</button>
            <button type="button" class="theme-btn" data-theme="mono">MONO<br />CHROME</button>
            <button type="button" class="theme-btn" data-theme="c64">COMMODORE<br />64</button>
          </div>
        </section>
        <section class="menu-section menu-save">
          <p class="menu-label">SAVE LOCATION</p>
          <p id="dest-label" class="menu-path">Desktop</p>
          <div class="menu-row">
            <button type="button" id="browse">BROWSE</button>
            <button type="button" id="reset-dest">DESKTOP</button>
          </div>
        </section>
        <section class="menu-section menu-about">
          <p class="menu-label">ABOUT</p>
          <div class="about-brand">
            <svg class="about-mark" viewBox="0 0 1024 1024" aria-hidden="true">
              <g
                transform="matrix(9.756098,0,0,9.756098,-317.268293,94.173067)"
                fill="currentColor"
                fill-rule="evenodd"
              >

          </div>
          <p class="menu-note">
            VERSION 1.0.0 by <a class="ext" href="https://mdeanjones.net/">Mick Jay</a>

          <p class="menu-note">
            FONT: Pet Me by<br /><a class="ext" href="https://www.kreativekorp.com/">Kreative Software</a>
          </p>
        </section>
      </div>
      <button type="button" id="quit">QUIT</button>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
